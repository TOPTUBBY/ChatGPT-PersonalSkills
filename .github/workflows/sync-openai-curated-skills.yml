name: Sync curated and Cloudflare security skills
on:
  workflow_dispatch:
  push:
    branches: [feature/private-skill-plugins]
    paths:
      - 'UPSTREAM_SKILLS.json'
      - 'scripts/sync-upstream-skills.py'
      - 'scripts/sync-cloudflare-security-audit.py'
      - '.github/workflows/sync-openai-curated-skills.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v4
        with:
          ref: feature/private-skill-plugins
          persist-credentials: true
      - name: Sync upstream curated skills
        run: python3 scripts/sync-upstream-skills.py
      - name: Sync Cloudflare security audit skill
        run: python3 scripts/sync-cloudflare-security-audit.py
      - name: Check Cloudflare audit validators
        run: |
          cd plugins/top-security-quality/skills/security-audit
          node --test validate-findings.test.cjs validate-coverage-ledger.test.cjs
      - name: Commit generated plugin bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins .agents/plugins/marketplace.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync OpenAI and Cloudflare security skills into private marketplace"
            git push origin HEAD:feature/private-skill-plugins
          fi
